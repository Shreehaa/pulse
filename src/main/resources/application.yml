spring:
  application:
    name: pulse

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${SPRING_DATASOURCE_USERNAME:pulse}
    password: ${SPRING_DATASOURCE_PASSWORD:pulse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

pulse:
  job-results-dir: data/job-results

  security:
    jwt-secret: ${PULSE_SECURITY_JWT_SECRET:test-secret-for-pulse-development-12345678901234567890}

  app:
    username: ${PULSE_APP_USERNAME:user}
    password: ${PULSE_APP_PASSWORD:pulse123}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO