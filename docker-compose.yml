services:

  postgres:
    image: postgres:16
    container_name: pulse-postgres
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_dev_password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - pulse-redis-data:/data

volumes:
  pulse-postgres-data:
  pulse-redis-data:
  